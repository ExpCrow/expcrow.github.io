
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>WordSaga: Crossword – ExpCrow</title>
<meta name="description" content="Relax your mind and challenge your vocabulary! Solve crossword puzzles, decorate rooms, and uncover the story of WordSaga."/>

<link rel="stylesheet" href="../css/style.css"/>

<style>
body {
    background: linear-gradient(135deg, #0b0f19, #1c2333);
    color: white;
    font-family: "Poppins", sans-serif;
    background-size: cover;
}

.details-wrapper {
    max-width: 760px;
    width: 90%;
    margin: 40px auto;
    padding: 22px 26px;
    border-radius: 20px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow: 0 6px 28px rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.08);
}

.game-thumb-large {
    text-align: center;
    margin-bottom: 25px;
}
.game-thumb-large img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 28px;
    padding: 6px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.45));
    transition: 0.25s;
}

.game-thumb-large img:hover {
    transform: scale(1.03);
    filter: drop-shadow(0 16px 35px rgba(0,0,0,0.55));
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 20px;
}

.description {
    line-height: 1.6;
    font-size: 18px;
    text-align: center;
    opacity: 0.95;
}

/* Galeri */
.gallery {
    margin-top: 35px;
    display: flex;
    justify-content: center;   /* galeriyi ortalıyoruz */
    flex-wrap: wrap;           /* alt satıra geçebilir */
    gap: 14px;
    padding: 10px 0;
}

.gallery img {
    height: 140px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
}

/* Store Butonları */
.store-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 30px 0;
}
.store-btn {
    padding: 12px 22px;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    text-decoration: none;
}
.store-btn.android { background: #3ddc84; }
.store-btn.ios { background: #007aff; }

/* Back Button */
.back-btn {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #ffffff;
    opacity: 0.7;
}
.back-btn:hover { opacity: 1; }

.lightbox-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999999;
}

.lightbox-overlay img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 16px;
    box-shadow: 0 0 35px rgba(0,0,0,0.6);
    animation: fadeIn 0.25s ease;
}

.lightbox-close {
    position: fixed;
    top: 25px;
    right: 25px;
    font-size: 32px;
    color: white;
    cursor: pointer;
    z-index: 1000000;
    font-weight: bold;
    text-shadow: 0 0 10px black;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}


/* Mobilde taşmayı engelle */
@media (max-width: 480px) {
    .details-wrapper {
        padding: 18px;
        margin: 20px auto;
        width: calc(100% - 24px);
        border-radius: 16px;
    }

    .gallery img {
        height: 110px;
    }
}

</style>

</head>

<body>

<div class="details-wrapper">

    <div class="game-thumb-large">
        <img src="../images/WordSagaCrossword.png" alt="WordSaga: Crossword">
    </div>

    <h1 data-en="WordSaga: Crossword" data-tr="WordSaga: Crossword">WordSaga: Crossword</h1>

    <p class="description"
       data-en="Relax your mind and challenge your vocabulary! Solve crossword puzzles, decorate rooms, and uncover the story of WordSaga."
       data-tr="Zihnini dinlendir, kelime dağarcığını zorla! Bulmacaları çöz, odanı dekore et ve WordSaga hikayesini keşfet.">
       Relax your mind and challenge your vocabulary! Solve crossword puzzles, decorate rooms, and uncover the story of WordSaga.
    </p>

    
        <div class="gallery">
            
                <img src="images/WordSagaCrossword1.jpg" alt="WordSaga: Crossword screenshot">
            
                <img src="images/WordSagaCrossword2.jpg" alt="WordSaga: Crossword screenshot">
            
                <img src="images/WordSagaCrossword3.jpg" alt="WordSaga: Crossword screenshot">
            
                <img src="images/WordSagaCrossword4.jpg" alt="WordSaga: Crossword screenshot">
            
        </div>

    <div class="store-buttons">
        <a href="https://play.google.com/store/apps/details?id=com.ExpCrow.WordSagaCrossWord" target="_blank" class="store-btn android">Android</a>
        <a href="https://apps.apple.com/app/wordsaga-crossword/id123456" target="_blank" class="store-btn ios">iOS</a>
    </div>

    <a href="../index.html" class="back-btn">Back</a>
</div>

<script src="../js/script.js"></script>
<div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">×</span>
    <img id="lightboxImage" src="">
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImage");
    const closeBtn = document.getElementById("lightboxClose");

    document.querySelectorAll(".gallery img").forEach(img => {
        img.addEventListener("click", () => {
            lightbox.style.display = "flex";
            lightboxImg.src = img.src;
        });
    });

    closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
    });

    lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
            lightbox.style.display = "none";
        }
    });

});
</script>


</body>
</html>
